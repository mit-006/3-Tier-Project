services:
  frontend:
    build:
      context: ./frontend
    container_name: mern-front
    networks:
      - mern-net
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mern-back
    networks:
      - mern-net
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo-db:27017/huxnStore
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo-db

  mongo-db:
    image: mongo:6
    container_name: mongo-db
    networks:
      - mern-net
    volumes:
      - mongo_data:/data/db

networks:
  mern-net:

volumes:
  mongo_data:
