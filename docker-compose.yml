services:

  frontend:
    build:
      context: ./frontend
    container_name: mern-front
    networks:
      - mern-net
    ports:
      - "3000:3000"
    depends_on:
      - backend


    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mern-back
    networks:
      - mern-net

    environment:
      - MONGO_URI=mongodb://mongo-db:27017/huxnStore
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=development
    depends_on:
      mongo-db:
        condition: service_healthy


    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/products', r => process.exit(r.statusCode < 500 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo-db:
    image: mongo:6
    container_name: mongo-db
    networks:
      - mern-net
    volumes:
      - mongo_data:/data/db


    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mern-net:

volumes:
  mongo_data:
